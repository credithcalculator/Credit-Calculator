<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones - Sistema de Comisiones</title>
    <style>
        /* ==============================================
           VARIABLES GLOBALES
           ============================================== */
        :root {
            --producer-gradient: linear-gradient(135deg, #27ae60, #2ecc71);
            --coordinador-gradient: linear-gradient(135deg, #3498db, #2980b9);
            --lider-gradient: linear-gradient(135deg, #e74c3c, #c0392b);
            --producer-color: #27ae60;
            --coordinador-color: #3498db;
            --lider-color: #e74c3c;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ==============================================
           PÁGINA PRINCIPAL
           ============================================== */
        .main-page {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1611224923853-80b023f02d71?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow);
            text-align: center;
            margin: 20px;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .role-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .role-card {
            display: block;
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            width: 100%;
            text-align: center;
        }

        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .role-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }

        .role-card:hover:before {
            left: 100%;
        }

        .role-card.producer {
            background: var(--producer-gradient);
        }

        .role-card.coordinador {
            background: var(--coordinador-gradient);
        }

        .role-card.lider {
            background: var(--lider-gradient);
        }

        .role-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .role-desc {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .lock-icon {
            font-size: 12px;
            margin-left: 5px;
        }

        .footer {
            margin-top: 30px;
            color: #95a5a6;
            font-size: 14px;
        }

        .update-badge {
            background: var(--text-dark);
            color: white;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* ==============================================
           PÁGINAS DE CÁLCULO (COMMON)
           ============================================== */
        .calculator-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .calculator-page.producer {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        .calculator-page.coordinador {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1551434678-e076c223a692?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        .calculator-page.lider {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?ixlib=rb-1.2.1&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin: 20px;
        }

        .calculator-container.large {
            max-width: 700px;
        }

        .calculator-container.medium {
            max-width: 600px;
        }

        .header {
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header.producer {
            background: var(--producer-gradient);
        }

        .header.coordinador {
            background: var(--coordinador-gradient);
        }

        .header.lider {
            background: var(--lider-gradient);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 16px;
        }

        .input-wrapper {
            position: relative;
            max-width: 300px;
            margin: 0 auto 25px;
        }

        .currency-symbol {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 20px;
        }

        .input-wrapper.producer .currency-symbol {
            color: var(--producer-color);
        }

        .input-wrapper.coordinador .currency-symbol {
            color: var(--coordinador-color);
        }

        .input-wrapper.lider .currency-symbol {
            color: var(--lider-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            background: #f8f9fa;
        }

        input[type="number"]:focus {
            border-color: var(--producer-color);
            background: white;
            outline: none;
        }

        .calculator-page.producer input[type="number"]:focus {
            border-color: var(--producer-color);
        }

        .calculator-page.coordinador input[type="number"]:focus {
            border-color: var(--coordinador-color);
        }

        .calculator-page.lider input[type="number"]:focus {
            border-color: var(--lider-color);
        }

        .calculate-btn {
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            max-width: 300px;
        }

        .calculate-btn.producer {
            background: var(--producer-gradient);
        }

        .calculate-btn.coordinador {
            background: var(--coordinador-gradient);
        }

        .calculate-btn.lider {
            background: var(--lider-gradient);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .result {
            background: linear-gradient(135deg, #f8fff9, #e8f6ef);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border: 2px solid var(--producer-color);
            text-align: center;
            display: none;
        }

        .result-label {
            color: var(--producer-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 42px;
            font-weight: 700;
            color: var(--producer-color);
            margin: 10px 0;
            line-height: 1.2;
        }

        .result-currency {
            color: #666;
            font-size: 14px;
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
            display: none;
        }

        .results-grid.two-cols {
            grid-template-columns: repeat(2, 1fr);
        }

        .results-grid.three-cols {
            grid-template-columns: repeat(3, 1fr);
        }

        .result-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .result-card.producer {
            background: linear-gradient(135deg, #e8f6ef, #d4efdf);
            border-top: 4px solid var(--producer-color);
        }

        .result-card.coordinador {
            background: linear-gradient(135deg, #ebf5fb, #d6eaf8);
            border-top: 4px solid var(--coordinador-color);
        }

        .result-card.lider {
            background: linear-gradient(135deg, #fdeaea, #fadbd8);
            border-top: 4px solid var(--lider-color);
        }

        .result-card .result-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .result-card .result-value {
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0;
        }

        .result-card.producer .result-value {
            color: var(--producer-color);
        }

        .result-card.coordinador .result-value {
            color: var(--coordinador-color);
        }

        .result-card.lider .result-value {
            color: var(--lider-color);
        }

        .result-card .result-currency {
            color: #666;
            font-size: 11px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .results-grid.two-cols,
            .results-grid.three-cols {
                grid-template-columns: 1fr;
            }
            
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
            
            .result-value {
                font-size: 32px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app"></div>

    <script>
        // ==============================================
        // 🎯 CALCULADORA DE COMISIONES - VERSIÓN COMPLETA
        // ==============================================

        // Variables globales
        let TASA_DOLAR_COP = 3800;

        // Configuración de contraseñas
        const PASSWORDS = {
            coordinador: 'coordinador123',
            lider: 'lider456'
        };

        // ==============================================
        // FUNCIONES DE CÁLCULO
        // ==============================================

        function obtenerTasaDolarCOP() {
            return TASA_DOLAR_COP;
        }

        async function actualizarTasaDesdeAPI() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await response.json();
                if (data.rates && data.rates.COP) {
                    TASA_DOLAR_COP = data.rates.COP;
                    return true;
                }
            } catch (error) {
                console.log('⚠️ Error obteniendo tasa, usando valor por defecto');
            }
            return false;
        }

        function calcularComisiones(consumoUSD, tasaCOP) {
            const galones = consumoUSD / 4;
            const rebates = galones * 0.33;
            const cliente = rebates * 0.30;
            const finoServices = rebates - cliente;
            const teamComercial = finoServices * 0.30;
            const producerCOP = (teamComercial / 100) * 60000;
            const coordinadorCOP = producerCOP / 2;
            const liderCOP = coordinadorCOP / 2;
            
            return {
                galones: galones,
                rebatesCOP: rebates * tasaCOP,
                clienteCOP: cliente * tasaCOP,
                finoServicesCOP: finoServices * tasaCOP,
                teamComercialCOP: teamComercial * tasaCOP,
                producerCOP: producerCOP,
                coordinadorCOP: coordinadorCOP,
                liderCOP: liderCOP
            };
        }

        function formatearCOP(valor) {
            return "$" + valor.toLocaleString('es-CO', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // ==============================================
        // RENDERIZADO DE PÁGINAS
        // ==============================================

        function renderizarMenuPrincipal() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="main-page">
                    <div class="container">
                        <div class="update-badge">🔄 ACTUALIZADO AUTOMÁTICAMENTE</div>
                        <div class="logo">💰</div>
                        <h1>CALCULADORA DE COMISIONES</h1>
                        <p class="subtitle">Selecciona tu rol para acceder</p>
                        
                        <div class="role-grid">
                            <button onclick="app.navegar('producer')" class="role-card producer">
                                <div class="role-icon">👤</div>
                                <div>PRODUCER</div>
                                <div class="role-desc">Acceso directo</div>
                            </button>
                            
                            <button onclick="app.solicitarContrasena('coordinador')" class="role-card coordinador">
                                <div class="role-icon">👥</div>
                                <div>COORDINADOR <span class="lock-icon">🔒</span></div>
                                <div class="role-desc">Acceso restringido</div>
                            </button>
                            
                            <button onclick="app.solicitarContrasena('lider')" class="role-card lider">
                                <div class="role-icon">🏢</div>
                                <div>LÍDER DE SEDE <span class="lock-icon">🔒</span></div>
                                <div class="role-desc">Acceso restringido</div>
                            </button>
                        </div>
                        
                        <div class="footer">
                            © 2025 Sistema de Comisiones
                        </div>
                    </div>
                </div>
            `;
        }

        function renderizarPaginaProducer() {
            const app = document.getElementById('app');
            const tasa = obtenerTasaDolarCOP();
            
            app.innerHTML = `
                <div class="calculator-page producer">
                    <div class="calculator-container">
                        <div class="header producer">
                            <button onclick="app.volverAlMenu()" class="back-btn">←</button>
                            <h1>PRODUCER</h1>
                        </div>
                        
                        <div class="content">
                            <div class="input-section">
                                <div class="input-label">CONSUMO (USD)</div>
                                <div class="input-wrapper producer">
                                    <span class="currency-symbol">$</span>
                                    <input type="number" id="valorConsumo" placeholder="0.00" step="0.01" min="0" autofocus>
                                </div>
                                <button class="calculate-btn producer" onclick="app.calcularProducer(${tasa})">CALCULAR</button>
                            </div>
                            
                            <div class="result" id="result">
                                <div class="result-label">COMISIÓN</div>
                                <div class="result-value" id="producerValue">$0</div>
                                <div class="result-currency">PESOS COLOMBIANOS</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const input = document.getElementById('valorConsumo');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        app.calcularProducer(tasa);
                    }
                });
                input.focus();
            }
        }

        function renderizarPaginaCoordinador() {
            const app = document.getElementById('app');
            const tasa = obtenerTasaDolarCOP();
            
            app.innerHTML = `
                <div class="calculator-page coordinador">
                    <div class="calculator-container medium">
                        <div class="header coordinador">
                            <button onclick="app.volverAlMenu()" class="back-btn">←</button>
                            <h1>COORDINADOR</h1>
                        </div>
                        
                        <div class="content">
                            <div class="input-section">
                                <div class="input-label">CONSUMO (USD)</div>
                                <div class="input-wrapper coordinador">
                                    <span class="currency-symbol">$</span>
                                    <input type="number" id="valorConsumo" placeholder="0.00" step="0.01" min="0" autofocus>
                                </div>
                                <button class="calculate-btn coordinador" onclick="app.calcularCoordinador(${tasa})">CALCULAR</button>
                            </div>
                            
                            <div class="results-grid two-cols" id="resultsGrid">
                                <div class="result-card producer">
                                    <div class="result-label">PRODUCER</div>
                                    <div class="result-value" id="producerValue">$0</div>
                                    <div class="result-currency">COP</div>
                                </div>
                                
                                <div class="result-card coordinador">
                                    <div class="result-label">COORDINADOR</div>
                                    <div class="result-value" id="coordinadorValue">$0</div>
                                    <div class="result-currency">COP</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const input = document.getElementById('valorConsumo');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        app.calcularCoordinador(tasa);
                    }
                });
                input.focus();
            }
        }

        function renderizarPaginaLider() {
            const app = document.getElementById('app');
            const tasa = obtenerTasaDolarCOP();
            
            app.innerHTML = `
                <div class="calculator-page lider">
                    <div class="calculator-container large">
                        <div class="header lider">
                            <button onclick="app.volverAlMenu()" class="back-btn">←</button>
                            <h1>LÍDER DE SEDE</h1>
                        </div>
                        
                        <div class="content">
                            <div class="input-section">
                                <div class="input-label">CONSUMO (USD)</div>
                                <div class="input-wrapper lider">
                                    <span class="currency-symbol">$</span>
                                    <input type="number" id="valorConsumo" placeholder="0.00" step="0.01" min="0" autofocus>
                                </div>
                                <button class="calculate-btn lider" onclick="app.calcularLider(${tasa})">CALCULAR</button>
                            </div>
                            
                            <div class="results-grid three-cols" id="resultsGrid">
                                <div class="result-card producer">
                                    <div class="result-label">PRODUCER</div>
                                    <div class="result-value" id="producerValue">$0</div>
                                    <div class="result-currency">COP</div>
                                </div>
                                
                                <div class="result-card coordinador">
                                    <div class="result-label">COORDINADOR</div>
                                    <div class="result-value" id="coordinadorValue">$0</div>
                                    <div class="result-currency">COP</div>
                                </div>
                                
                                <div class="result-card lider">
                                    <div class="result-label">LÍDER</div>
                                    <div class="result-value" id="liderValue">$0</div>
                                    <div class="result-currency">COP</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const input = document.getElementById('valorConsumo');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        app.calcularLider(tasa);
                    }
                });
                input.focus();
            }
        }

        // ==============================================
        // FUNCIONES DE CÁLCULO POR ROL
        // ==============================================

        function calcularProducer(tasaCOP) {
            const valorInput = document.getElementById("valorConsumo").value;
            
            if (!valorInput || valorInput <= 0) {
                alert("Ingresa un valor válido");
                return;
            }
            
            const consumo = parseFloat(valorInput);
            const comisiones = calcularComisiones(consumo, tasaCOP);
            
            document.getElementById("producerValue").textContent = formatearCOP(comisiones.producerCOP);
            document.getElementById("result").style.display = "block";
        }

        function calcularCoordinador(tasaCOP) {
            const valorInput = document.getElementById('valorConsumo').value;
            
            if (!valorInput || valorInput <= 0) {
                alert('Ingresa un valor válido');
                return;
            }
            
            const consumo = parseFloat(valorInput);
            const comisiones = calcularComisiones(consumo, tasaCOP);
            
            document.getElementById('producerValue').textContent = formatearCOP(comisiones.producerCOP);
            document.getElementById('coordinadorValue').textContent = formatearCOP(comisiones.coordinadorCOP);
            
            document.getElementById('resultsGrid').style.display = 'grid';
        }

        function calcularLider(tasaCOP) {
            const valorInput = document.getElementById('valorConsumo').value;
            
            if (!valorInput || valorInput <= 0) {
                alert('Ingresa un valor válido');
                return;
            }
            
            const consumo = parseFloat(valorInput);
            const comisiones = calcularComisiones(consumo, tasaCOP);
            
            document.getElementById('producerValue').textContent = formatearCOP(comisiones.producerCOP);
            document.getElementById('coordinadorValue').textContent = formatearCOP(comisiones.coordinadorCOP);
            document.getElementById('liderValue').textContent = formatearCOP(comisiones.liderCOP);
            
            document.getElementById('resultsGrid').style.display = 'grid';
        }

        // ==============================================
        // NAVEGACIÓN Y AUTENTICACIÓN
        // ==============================================

        function solicitarContrasena(rol) {
            const contrasena = prompt('Ingresa la contraseña para ' + rol.toUpperCase() + ':');
            
            if (contrasena && contrasena === PASSWORDS[rol]) {
                navegar(rol);
            } else if (contrasena) {
                alert('Contraseña incorrecta');
            }
        }

        function navegar(rol) {
            switch(rol) {
                case 'producer':
                    renderizarPaginaProducer();
                    break;
                case 'coordinador':
                    renderizarPaginaCoordinador();
                    break;
                case 'lider':
                    renderizarPaginaLider();
                    break;
                default:
                    renderizarMenuPrincipal();
            }
        }

        function volverAlMenu() {
            renderizarMenuPrincipal();
        }

        // ==============================================
        // INICIALIZACIÓN
        // ==============================================

        // Exponer funciones globalmente
        window.app = {
            navegar,
